<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;💳&lt;/text&gt;&lt;/svg&gt;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Tracker — SubTrack ₹</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for running JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --surface-color: #ffffff;
      --surface-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-subtle: #cbd5e1;
      
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      
      --success-color: #059669;
      --success-light: #ecfdf5;
      --success-border: #a7f3d0;
      
      --danger-color: #dc2626;
      --danger-hover: #b91c1c;
      --danger-light: #fef2f2;
      --danger-border: #fecaca;

      --accent-purple: #7c3aed;
      --accent-purple-light: #f5f3ff;
      --accent-purple-border: #ddd6fe;

      --accent-amber: #d97706;
      --accent-amber-light: #fffbeb;
      --accent-amber-border: #fde68a;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 12px 20px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; }
    .page-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
    .main-content-flow { display: flex; flex-direction: column; gap: 70px; padding-bottom: 60px; }

    /* Minimal Keyframes */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes streamData { 0% { transform: translateX(0); opacity: 0.2; } 50% { opacity: 1; } 100% { transform: translateX(100px); opacity: 0.2; } }
    @keyframes pulseRadar { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); } 70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }
    @keyframes pulseWarning { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4); } 70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(217, 119, 6, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); } }
    @keyframes barGrow { 0% { width: 15%; } 50% { width: 60%; } 100% { width: 15%; } }

    /* Navbar */
    .site-navbar { position: sticky; top: 0; z-index: 100; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 14px 24px; }
    .nav-container { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .nav-brand { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; font-weight: 700; color: var(--text-main); cursor: pointer; user-select: none; }
    .brand-icon { font-size: 1.4rem; }
    .brand-currency { color: var(--primary-color); font-weight: 800; }
    .nav-links { display: flex; list-style: none; align-items: center; gap: 6px; }
    .nav-link-btn { background: transparent; border: none; font-family: inherit; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: color 0.2s, background-color 0.2s; }
    .nav-link-btn:hover { color: var(--primary-color); background-color: var(--primary-light); }
    .btn-nav-cta { background-color: var(--primary-color); color: #ffffff; padding: 8px 16px; font-size: 0.9rem; font-weight: 600; border-radius: var(--radius-sm); border: none; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
    .btn-nav-cta:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

    /* Hero */
    .hero-section { max-width: 1000px; margin: 0 auto; padding: 50px 20px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .hero-badge { display: inline-flex; align-items: center; gap: 6px; background-color: var(--primary-light); border: 1px solid var(--primary-border); color: var(--primary-color); font-size: 0.875rem; font-weight: 600; padding: 6px 16px; border-radius: var(--radius-full); margin-bottom: 20px; }
    .hero-headline { font-size: 2.75rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.03em; color: var(--text-main); margin-bottom: 18px; }
    .hero-highlight { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-subheadline { max-width: 720px; font-size: 1.125rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.6; }
    .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
    .btn-hero-primary { background-color: var(--primary-color); color: #ffffff; font-size: 1.05rem; font-weight: 600; padding: 14px 28px; border-radius: var(--radius-sm); border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3); transition: all 0.2s ease; }
    .btn-hero-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
    .btn-hero-secondary { background-color: var(--surface-color); color: var(--text-main); border: 1.5px solid var(--border-color); font-size: 1.05rem; font-weight: 600; padding: 14px 24px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s ease; }
    .btn-hero-secondary:hover { background-color: var(--surface-muted); border-color: var(--border-subtle); transform: translateY(-1px); }

    /* Native Showcase Preview */
    .demo-showcase-container { width: 100%; max-width: 960px; margin-top: 10px; }
    .mockup-window { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); overflow: hidden; text-align: left; }
    .mockup-header { background: #f1f5f9; border-bottom: 1px solid var(--border-color); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; }
    .mockup-dots { display: flex; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ef4444; } .dot-yellow { background: #f59e0b; } .dot-green { background: #10b981; }
    .mockup-address-bar { background: #ffffff; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 20px; font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
    .mockup-actions { font-size: 0.8rem; font-weight: 700; color: var(--primary-color); }
    .mockup-dashboard-preview { background: #f8fafc; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .mini-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .mini-stat-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-sm); }
    .mini-stat-icon { font-size: 1.5rem; background: var(--bg-color); width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); flex-shrink: 0; }
    .mini-stat-info { display: flex; flex-direction: column; min-width: 0; }
    .mini-stat-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .mini-stat-val { font-size: 1.15rem; font-weight: 800; color: var(--text-main); line-height: 1.2; }
    .mini-stat-sub { font-size: 0.7rem; font-weight: 600; }
    .text-green { color: var(--success-color); } .text-blue { color: var(--primary-color); } .text-purple { color: var(--accent-purple); } .text-amber { color: var(--accent-amber); }
    .highlight-card { border-color: var(--primary-border); background: #f0f7ff; }
    .alert-card { border-color: var(--accent-amber-border); background: #fffdf5; }
    .mini-subs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .mini-sub-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm); }
    .mini-sub-top { display: flex; justify-content: space-between; align-items: center; }
    .mini-sub-icon-badge { font-size: 1.3rem; }
    .mini-sub-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: var(--radius-full); }
    .badge-monthly-pill { background: var(--primary-light); color: var(--primary-color); }
    .badge-yearly-pill { background: var(--accent-purple-light); color: var(--accent-purple); }
    .mini-sub-title { font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-sub-pricing { display: flex; align-items: baseline; gap: 3px; }
    .mini-sub-price { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }
    .mini-sub-period { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .mini-sub-equiv { font-size: 0.7rem; color: var(--accent-purple); background: var(--accent-purple-light); padding: 2px 6px; border-radius: 4px; align-self: flex-start; }
    .mini-sub-renewal { font-size: 0.725rem; color: var(--text-muted); font-weight: 500; }
    .hero-pill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 24px; }
    .hero-pill { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #334155; text-align: left; box-shadow: var(--shadow-sm); }
    .pill-icon { font-size: 1.4rem; flex-shrink: 0; }

    /* Common Sections */
    .info-section { max-width: 1000px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .section-header-wrap { text-align: center; max-width: 760px; margin: 0 auto 36px; }
    .section-kicker { display: inline-block; font-size: 0.825rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-color); margin-bottom: 8px; }
    .section-main-title { font-size: 2.15rem; font-weight: 800; letter-spacing: -0.025em; color: var(--text-main); margin-bottom: 12px; }
    .section-main-subtitle { font-size: 1.05rem; color: var(--text-muted); line-height: 1.6; }

    /* What is it */
    .callout-box { background: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%); border: 1px solid var(--primary-border); border-radius: var(--radius-md); padding: 24px; display: flex; gap: 20px; align-items: flex-start; margin-bottom: 36px; }
    .callout-icon { font-size: 2.2rem; flex-shrink: 0; }
    .callout-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
    .callout-body p { color: #334155; font-size: 0.975rem; line-height: 1.6; }
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; }
    .comparison-card { background-color: var(--surface-color); border-radius: var(--radius-md); padding: 28px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px; }
    .card-negative { border: 1px solid var(--danger-border); background-color: #fffaf9; }
    .card-positive { border: 1px solid var(--success-border); background-color: #f7fdfa; }
    .comparison-badge { display: inline-block; align-self: flex-start; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-full); }
    .badge-danger { background-color: var(--danger-light); color: var(--danger-color); }
    .badge-success { background-color: var(--success-light); color: var(--success-color); }
    .comparison-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
    .comparison-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .comparison-list li { font-size: 0.95rem; color: #334155; position: relative; padding-left: 20px; }
    .comparison-list li::before { content: "•"; position: absolute; left: 4px; font-size: 1.2rem; color: var(--text-muted); }
    .pillars-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .pillar-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); transition: transform 0.2s ease; }
    .pillar-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .pillar-icon { font-size: 2rem; margin-bottom: 12px; }
    .pillar-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .pillar-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }

    /* Workflow Banner */
    .workflow-banner-container { margin-bottom: 36px; }
    .workflow-banner-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-md); gap: 12px; flex-wrap: wrap; }
    .banner-step-item { display: flex; align-items: center; gap: 12px; }
    .banner-step-circle { width: 36px; height: 36px; border-radius: 50%; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; flex-shrink: 0; }
    .circle-blue { background: var(--primary-color); } .circle-purple { background: var(--accent-purple); } .circle-amber { background: var(--accent-amber); } .circle-green { background: var(--success-color); }
    .banner-step-text { display: flex; flex-direction: column; }
    .banner-step-text strong { font-size: 0.95rem; color: var(--text-main); }
    .banner-step-text span { font-size: 0.8rem; color: var(--text-muted); }
    .banner-connector-arrow { color: #94a3b8; font-size: 1.2rem; font-weight: 700; }
    .steps-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .step-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); }
    .step-number-badge { display: inline-block; align-self: flex-start; background-color: var(--primary-light); color: var(--primary-color); font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: var(--radius-sm); text-transform: uppercase; letter-spacing: 0.5px; }
    .step-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .step-description { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }

    /* Animated Workflow Boxes */
    .anim-tab-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
    .anim-tab-btn { background-color: var(--surface-color); border: 1.5px solid var(--border-color); border-radius: var(--radius-md); padding: 10px 18px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s ease; }
    .anim-tab-btn:hover { border-color: var(--primary-color); background-color: var(--primary-light); }
    .tab-active { border-color: var(--primary-color); background-color: var(--primary-light); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
    .tab-num { font-weight: 800; font-size: 0.8rem; color: var(--primary-color); background: #ffffff; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--primary-border); }
    .tab-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    .anim-stage-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); position: relative; min-height: 380px; }
    .anim-fade-in { animation: fadeIn 0.3s ease forwards; }
    .anim-box-header { margin-bottom: 24px; }
    .anim-badge { display: inline-block; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: var(--radius-sm); text-transform: uppercase; margin-bottom: 8px; }
    .badge-blue { background: var(--primary-light); color: var(--primary-color); }
    .badge-purple { background: var(--accent-purple-light); color: var(--accent-purple); }
    .badge-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
    .badge-green { background: var(--success-light); color: var(--success-color); }
    .anim-box-title { font-size: 1.35rem; font-weight: 800; color: var(--text-main); }
    .anim-visual-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; }
    .anim-mockup-form { background: var(--surface-muted); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .mockup-input-row { display: flex; flex-direction: column; gap: 4px; }
    .mockup-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .mockup-input-box { background: #ffffff; border: 1.5px solid var(--primary-border); padding: 8px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 500; }
    .typing-cursor { display: inline-block; width: 2px; height: 16px; background-color: var(--primary-color); animation: cursorBlink 0.8s infinite; }
    .code-payload-preview { background: #0f172a; color: #38bdf8; padding: 14px; border-radius: var(--radius-sm); font-size: 0.8rem; font-family: monospace; line-height: 1.4; margin: 10px 0; }
    .anim-math-visual { display: flex; flex-direction: column; gap: 24px; }
    .math-formula-card { background: linear-gradient(135deg, #f5f3ff 0%, #eff6ff 100%); border: 1px solid var(--accent-purple-border); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .math-equation-row { display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 12px; }
    .equation-part { background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; flex-direction: column; align-items: center; box-shadow: var(--shadow-sm); }
    .eq-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .eq-val { font-size: 1.25rem; font-weight: 800; color: var(--text-main); }
    .equation-operator { font-size: 1.8rem; font-weight: 800; color: var(--accent-purple); }
    .eq-glow { border-color: var(--accent-purple); box-shadow: 0 0 12px rgba(124, 58, 237, 0.25); background: #faf5ff; }
    .animated-progress-bar-wrap { display: flex; flex-direction: column; gap: 6px; }
    .progress-label-row { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: #475569; }
    .progress-bar-track { background: #e2e8f0; height: 12px; border-radius: var(--radius-full); overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: var(--radius-full); }
    .animated-bar-pulse { animation: barGrow 4s ease-in-out infinite; }
    .radar-timeline-container { background: #0f172a; border-radius: var(--radius-md); padding: 36px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; margin-bottom: 16px; }
    .timeline-line { position: absolute; left: 40px; right: 40px; height: 3px; background: #334155; z-index: 1; }
    .timeline-node { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; background: #1e293b; border: 2px solid #475569; border-radius: var(--radius-md); padding: 10px 14px; color: #ffffff; }
    .node-today { border-color: var(--primary-color); } .node-warning { border-color: var(--accent-amber); } .node-renewal { border-color: var(--danger-color); }
    .pulse-circle { position: absolute; width: 100%; height: 100%; border-radius: var(--radius-md); animation: pulseRadar 2s infinite; pointer-events: none; }
    .pulse-warning-circle { position: absolute; width: 100%; height: 100%; border-radius: var(--radius-md); animation: pulseWarning 1.8s infinite; pointer-events: none; }
    .node-icon { font-size: 1.3rem; } .node-text { font-size: 0.85rem; font-weight: 700; } .node-sub { font-size: 0.7rem; color: #94a3b8; }
    .vault-flow-container { background: #0f172a; border-radius: var(--radius-md); padding: 36px 24px; display: flex; align-items: center; justify-content: space-between; color: #ffffff; position: relative; }
    .vault-app-source, .vault-storage-target { display: flex; flex-direction: column; align-items: center; background: #1e293b; border: 1px solid #334155; border-radius: var(--radius-md); padding: 16px 20px; }

    // 6. DashboardSummary
    function DashboardSummary({ subscriptions }) {
      const totalCount = subscriptions.length;
      const totalMonthlySpending = subscriptions.reduce((sum, sub) => {
        const monthlyCost = sub.billingCycle === 'Yearly' ? sub.price / 12 : sub.price;
        return sum + monthlyCost;
      }, 0);
      const estimatedYearlySpending = totalMonthlySpending * 12;

      const getUpcomingRenewal = () => {
        if (subscriptions.length === 0) return null;
        const sorted = [...subscriptions].sort((a, b) => new Date(a.renewalDate) - new Date(b.renewalDate));
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const upcoming = sorted.find((sub) => new Date(sub.renewalDate) >= today);
        const nextSub = upcoming || sorted[0];
        const formattedDate = new Date(nextSub.renewalDate).toLocaleDateString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric',
        });
        return { name: nextSub.name, date: formattedDate };
      };

      const upcomingRenewal = getUpcomingRenewal();

      return (
        <section className="dashboard-summary" aria-label="Dashboard Summary">
          <div className="summary-card">
            <div className="summary-icon">📋</div>
            <div className="summary-info">
              <span className="summary-label">Active Subscriptions</span>
              <h3 className="summary-value">{totalCount}</h3>
            </div>
          </div>

          <div className="summary-card">
            <div className="summary-icon">💳</div>
            <div className="summary-info">
              <span className="summary-label">Monthly Spending</span>
              <h3 className="summary-value">{formatINR(totalMonthlySpending)}</h3>
            </div>
          </div>

          <div className="summary-card">

    // 7. SubscriptionForm
    function SubscriptionForm({ onAddSubscription }) {
      const [name, setName] = useState('');
      const [price, setPrice] = useState('');
      const [billingCycle, setBillingCycle] = useState('Monthly');
      const [renewalDate, setRenewalDate] = useState('');
      const [errorMessage, setErrorMessage] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          setErrorMessage('Please enter a subscription name.');
          return;
        }
        const parsedPrice = parseFloat(price);
        if (isNaN(parsedPrice) || parsedPrice <= 0) {
          setErrorMessage('Please enter a valid price greater than ₹0.');
          return;
        }
        if (!renewalDate) {
          setErrorMessage('Please select a renewal date.');
          return;
        }

        setErrorMessage('');
        const newSubscription = {
          id: Date.now().toString(),
          name: name.trim(),
          price: parsedPrice,
          billingCycle: billingCycle,
          renewalDate: renewalDate,
        };

        onAddSubscription(newSubscription);
        setName('');
        setPrice('');
        setBillingCycle('Monthly');
        setRenewalDate('');
      };

      return (
        <section className="form-container" aria-labelledby="form-heading">
          <h2 id="form-heading" className="section-title">➕ Add New Subscription</h2>
          {errorMessage && (
            <div className="error-alert" role="alert">
              <span>⚠️ {errorMessage}</span>
            </div>
          )}

          <form onSubmit={handleSubmit} className="subscription-form" noValidate>
            <div className="form-group">
              <label htmlFor="sub-name">Subscription Name</label>
              <input
                id="sub-name"
                type="text"
                placeholder="e.g. Netflix, Spotify, Prime"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="form-input"
                required
              />
            </div>

            <div className="form-group">
              <label htmlFor="sub-price">Price (₹)</label>
              <div className="price-input-wrapper">
                <span className="currency-prefix">₹</span>
                <input
                  id="sub-price"
                  type="number"
                  min="0.01"
                  step="any"
                  placeholder="e.g. 499"
                  value={price}
                  onChange={(e) => setPrice(e.target.value)}
                  className="form-input price-input"
                  required
                />
              </div>
            </div>

            <div className="form-group">
              <label htmlFor="sub-cycle">Billing Cycle</label>
              <select
                id="sub-cycle"
                value={billingCycle}
                onChange={(e) => setBillingCycle(e.target.value)}
                className="form-input form-select"
              >
                <option value="Monthly">Monthly</option>
                <option value="Yearly">Yearly</option>
              </select>
            </div>

            <div className="form-group">
              <label htmlFor="sub-date">Renewal Date</label>
              <input
                id="sub-date"
                type="date"
                value={renewalDate}
                onChange={(e) => setRenewalDate(e.target.value)}
                className="form-input"
                required
              />
            </div>

            <div className="form-group form-button-group">
              <button type="submit" className="btn btn-primary">Add Subscription</button>
            </div>
          </form>
        </section>
      );
    }

          </div>

          <div className="footer-bottom-row">
            <p className="footer-copyright">© {new Date().getFullYear()} SubTrack INR • Built with React & Plain CSS • Zero Tracking • 100% Private</p>
            <button type="button" onClick={scrollToTop} className="btn-back-to-top">↑ Back to top</button>
          </div>
        </footer>
      );
    }

    // 16. App Main Root
    function App() {
      const [subscriptions, setSubscriptions] = useState(() => {
        try {
          const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (savedData !== null) return JSON.parse(savedData);
        } catch (error) {
          console.error('Error loading subscriptions from localStorage:', error);
        }
        return DEFAULT_SUBSCRIPTIONS;
      });

      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(subscriptions));
        } catch (error) {
          console.error('Error saving subscriptions to localStorage:', error);
        }
      }, [subscriptions]);

      const handleAddSubscription = (newSub) => {
        setSubscriptions((prev) => [newSub, ...prev]);
      };

      const handleDeleteSubscription = (idToDelete) => {
        setSubscriptions((prev) => prev.filter((sub) => sub.id !== idToDelete));
      };

      const handleResetToDefault = () => setSubscriptions(DEFAULT_SUBSCRIPTIONS);
      const handleClearAll = () => setSubscriptions([]);

      return (
        <div className="page-wrapper">
          <Navbar />
          <main className="main-content-flow">
            <HeroSection />
            <WhatIsIt />
            <HowItWorks />
            <AnimatedWorkflowBoxes />
            <section id="tracker-section" className="tracker-app-section" aria-labelledby="tracker-heading">
              <div className="section-header-wrap">
                <span className="section-kicker">⚡ Live Interactive Dashboard</span>
                <h2 id="tracker-heading" className="section-main-title">Your Subscription Tracker</h2>
                <p className="section-main-subtitle">Add your services below to automatically compute your monthly run-rate, estimated yearly budget, and next upcoming renewal dates in Indian Rupees (₹).</p>
              </div>
              <div className="app-container">
                <DashboardSummary subscriptions={subscriptions} />
                <SubscriptionForm onAddSubscription={handleAddSubscription} />
                <SubscriptionList subscriptions={subscriptions} onDeleteSubscription={handleDeleteSubscription} />
              </div>
            </section>
            <InteractiveCalculator />
            <IndianServicesDirectory onQuickAdd={handleAddSubscription} />
            <PrivacyArchitectureBox />
            <SavingsGuide />
            <FaqSection />
          </main>
          <Footer onResetToDefault={handleResetToDefault} onClearAll={handleClearAll} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
